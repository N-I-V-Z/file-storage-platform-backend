name: Quality

on:
  pull_request:
  push:
    branches: [develop, main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://file_storage:ci-only-password@127.0.0.1:5432/file_storage
      REDIS_URL: redis://127.0.0.1:6379
      STORAGE_ROOT: ./.local-storage
      CORS_ORIGINS: http://localhost:3000
      JWT_ACCESS_SECRET: ci-only-access-secret-for-tests-0001
      JWT_REFRESH_SECRET: ci-only-refresh-secret-for-tests-0002
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: file_storage
          POSTGRES_USER: file_storage
          POSTGRES_PASSWORD: ci-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U file_storage -d file_storage"
          --health-interval 10s
          --health-timeout 3s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 3s
          --health-retries 5
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 12.21.0
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:generate
      - run: pnpm db:migrate:deploy
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm test:e2e
      - run: pnpm build

  publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          target: runtime
          push: true
          tags: |
            nivz0911/file-storage-platform-backend:latest
            nivz0911/file-storage-platform-backend:${{ github.sha }}
          cache-from: type=gha,scope=backend-runtime
          cache-to: type=gha,mode=max,scope=backend-runtime
      - uses: docker/build-push-action@v6
        with:
          context: .
          target: migrate
          push: true
          tags: |
            nivz0911/file-storage-platform-backend:migrate-latest
            nivz0911/file-storage-platform-backend:migrate-${{ github.sha }}
          cache-from: type=gha,scope=backend-migrate
          cache-to: type=gha,mode=max,scope=backend-migrate
